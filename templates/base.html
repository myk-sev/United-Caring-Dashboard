{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}UCS Shelter Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'mainscreen/site.css' %}" rel="stylesheet">
  </head>
  <body class="site-shell route-{{ request.resolver_match.url_name|default:'page' }}">
    <nav class="site-navbar" aria-label="Primary navigation">
      <div class="site-nav-inner">
        <a class="site-brand" href="{% url 'mainscreen' %}">
          <span class="site-brand-mark" aria-hidden="true">UCS</span>
          <span>Shelter System</span>
        </a>
        <div class="site-nav-links">
          <a href="{% url 'mainscreen' %}"{% if request.resolver_match.url_name == 'mainscreen' %} aria-current="page"{% endif %}>Main Screen</a>
          <a href="{% url 'admin_login' %}"{% if 'admin_' in request.resolver_match.url_name %} aria-current="page"{% endif %}>Administration</a>
          <a href="{% url 'mainscreen' %}">Submit Shift</a>
          <a href="{% url 'reports' %}"{% if request.resolver_match.url_name == 'reports' %} aria-current="page"{% endif %}>Reports</a>
          <a class="site-logout" href="{% url 'logout' %}">Logout</a>
        </div>
      </div>
    </nav>

    <div class="site-content">
      {% block content %}
        <p>This page's actual content goes here.</p>
      {% endblock %}
    </div>
  </body>
</html>
